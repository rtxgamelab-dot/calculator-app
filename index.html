<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; font-family: sans-serif; margin: 0; }
.calculator { background: #333; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
#display { width: 100%; height: 50px; background: #222; color: #fff; font-size: 24px; text-align: right; border: none; padding: 10px; box-sizing: border-box; border-radius: 5px; margin-bottom: 15px; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
button { padding: 20px; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; background: #555; color: white; }
button:hover { background: #777; }
button.operator { background: #f39c12; }
button.operator:hover { background: #e67e22; }
button.clear { background: #e74c3c; }
button.clear:hover { background: #c0392b; }
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" readonly>
<div class="buttons">
<button class="clear" onclick="clearDisplay()">C</button>
<button onclick="appendValue('/')">/</button>
<button onclick="appendValue('*')">*</button>
<button onclick="appendValue('-')">-</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('+')">+</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="operator" onclick="calculate()">=</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button onclick="appendValue('0')">0</button>
</div>
</div>
<script>
const display = document.getElementById('display');
function appendValue(val) { display.value += val; }
function clearDisplay() { display.value = ''; }
function calculate() { try { display.value = eval(display.value); } catch(e) { display.value = 'Error'; } }
</script>
</body>
</html>
